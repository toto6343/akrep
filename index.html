function drawOpt(){if(!op1)return;g.fillStyle='rgba(0,0,0,.78)';g.fillRect(0,0,W,H);g.fillStyle='#0b1228';g.fillRect(50,170,380,380);g.strokeStyle='#7df9ff';g.lineWidth=2;g.strokeRect(50,170,380,380);T('OPTIONS',240,210,24,'#7df9ff','center',1);
 const L=['BGM','효과음','화면 효과','난이도','탄환 구분'];OR.forEach((ry,i)=>{const on=i===opi;T(L[i],70,ry+6,16,on?'#ffd23f':'#d8f3ff','left');g.strokeStyle=on?'#ffd23f':'#8fb3c9';g.lineWidth=1.5;
  if(i<2){[250,370].forEach((bx,j)=>{g.strokeRect(bx,ry-17,40,34);T(j?'+':'-',bx+20,ry+7,20,'#d8f3ff')});T(Math.round((i?sv.sv??1:sv.bv??1)*100)+'%',330,ry+6,15,'#d8f3ff')}
  else{g.strokeRect(250,ry-17,160,34);T(i===2?(sv.fx?'줄임 (흔들림·번쩍임)':'기본'):i===3?(sv.easy?'EASY (피격↓ 보스HP↓)':'NORMAL'):['OFF','테두리','테두리 + 색 보정'][sv.cb|0],330,ry+6,14,'#d8f3ff','center',0,150)}});
 g.strokeStyle='#7df9ff';g.strokeRect(160,490,160,42);T('닫기',240,518,16,'#7df9ff')}
function drawGear(){if(sc!=='title')return;g.save();g.globalAlpha=.85;g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.arc(448,90,17,0,7);g.fill();g.restore();T('OPT',448,94,10,'#d8f3ff');g.save();g.globalAlpha=.85;g.fillStyle='rgba(0,0,0,.45)';g.fillRect(424,112,48,26);g.strokeStyle='#7df9ff';g.lineWidth=1.5;g.strokeRect(424,112,48,26);g.restore();T('크레딧',448,131,14,'#d8f3ff')}
function drawNote(){if(svFail&&(sc==='title'||sc==='rank'))T('저장 불가 환경: 기록이 유지되지 않습니다',240,716,11,'#ffb347')}
const GPM=[[0,'Enter'],[1,'b'],[9,'p'],[12,'ArrowUp'],[13,'ArrowDown'],[14,'ArrowLeft'],[15,'ArrowRight']],gps={};
function gpPoll(){const gp=(navigator.getGamepads?navigator.getGamepads():[])[0];if(!gp)return;const st={};GPM.forEach(([i,k])=>{if(gp.buttons[i]&&gp.buttons[i].pressed)st[k]=1});const ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(ax<-.5)st.ArrowLeft=1;if(ax>.5)st.ArrowRight=1;if(ay<-.5)st.ArrowUp=1;if(ay>.5)st.ArrowDown=1;
 new Set([...Object.keys(st),...Object.keys(gps)]).forEach(k=>{if(!!st[k]!==!!gps[k])dispatchEvent(new KeyboardEvent(st[k]?'keydown':'keyup',{key:k}))});for(const k in gps)delete gps[k];Object.assign(gps,st)}
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
cv.addEventListener('pointerdown',e=>{const[x,y]=pt(e);aInit();if(op1){optClick(x,y);return}if(sc==='title'&&x>=424&&x<=472&&y>=112&&y<=140){openCredits();return}if(sc==='title'&&(x-448)**2+(y-90)**2<576){op1=1;return}if(sc==='play'&&pz&&Math.abs(x-240)<90&&Math.abs(y-440)<20){op1=1;return}if((x-448)**2+(y-54)**2<576){toggleMute();return}
 if(sc==='play'&&pz){pz=0;return}
 if(sc==='play'&&(x-448)**2+(y-90)**2<576){pz=1;dr=null;return}
 if(sc==='play'){if((x-420)**2+(y-650)**2<2500){bomb();return}dr={id:e.pointerId,sx:x,sy:y,ox:P.x,oy:P.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}}
 else if(sc==='choice'){if(y>360&&y<450)pick(0);else if(y>470&&y<560)pick(1)}
 else if(sc==='end'){if(lock>0||y<612||y>684)return;if(x>=30&&x<=230)nextLap();else if(x>=250&&x<=450)toTitle()}
 else if(sc==='over'){if(lock>0)return;if(x>=60&&x<=420){if(y>=370&&y<=450)overPick(0);else if(y>=470&&y<=550)overPick(1)}}
 else if(sc==='name'){if(lock>0)return;sfx('tick');
  [130,240,350].forEach((cx,i)=>{if(Math.abs(x-cx)<45){if(y>=245&&y<=292){nm[i]=(nm[i]+1)%36;ni=i}else if(y>=380&&y<=425){nm[i]=(nm[i]+35)%36;ni=i}else if(y>292&&y<380)ni=i}});
  if(x>=140&&x<=340&&y>=470&&y<=530)confirmName()}
 else if(sc==='intro')introNext();
 else if(sc==='rank')rankBack();
 else if(sc==='credits')closeCredits();
 else if(sc==='title'){if(y>=674&&y<=708&&x>=60&&x<=230)openRank();else if(y>=674&&y<=708&&x>=250&&x<=420)openIntro();else adv()}
 else adv()});
cv.addEventListener('pointermove',e=>{if(dr&&sc==='play'&&e.pointerId===dr.id){const[x,y]=pt(e);P.x=dr.ox+(x-dr.sx);P.y=dr.oy+(y-dr.sy)}});
const dre=e=>{if(dr&&e.pointerId===dr.id)dr=null};cv.addEventListener('pointerup',dre);cv.addEventListener('pointercancel',dre);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;aInit();if(op1){optKey(k);return}if(sc==='title'&&k==='o'){op1=1;return}if(k==='m'&&sc!=='name')toggleMute();if(k.startsWith('arrow')||k===' ')e.preventDefault();
 if(sc==='play'&&pz&&(k===' '||k==='enter'||k==='p'||k==='escape')){if(!e.repeat)pz=0;return}
 if(sc==='play'&&(k==='p'||k==='escape')){if(!e.repeat)pz=1;return}
 if(sc==='play'&&!pz&&(k==='b'||k===' '||k==='x')&&!e.repeat)bomb();
 if(sc==='choice'){if(k==='1')pick(0);if(k==='2')pick(1)}
 else if(sc==='end'){if(k==='1'||k==='enter')nextLap();else if(k==='2'||k==='escape')toTitle()}
 else if(sc==='over'){if(k==='1'||k==='enter')overPick(0);else if(k==='2'||k==='escape')overPick(1)}
 else if(sc==='name'){if(k!=='enter')sfx('tick');
  if(k==='arrowup')nm[ni]=(nm[ni]+1)%36;else if(k==='arrowdown')nm[ni]=(nm[ni]+35)%36;
  else if(k==='arrowleft'||k==='backspace')ni=Math.max(0,ni-1);else if(k==='arrowright')ni=Math.min(2,ni+1);
  else if(k==='enter'){if(!e.repeat)confirmName()}
  else if(k.length===1&&CH36.includes(k.toUpperCase())&&!e.ctrlKey&&!e.metaKey){nm[ni]=CH36.indexOf(k.toUpperCase());ni=Math.min(2,ni+1)}}
 else if(sc==='rank'){if(!e.repeat&&(k==='enter'||k===' '||k==='escape'))rankBack()}
 else if(sc==='intro'){if(!e.repeat&&(k==='enter'||k===' '))introNext();else if(k==='escape')introEnd()}
 else if(sc==='credits'){if(!e.repeat&&(k==='enter'||k===' '||k==='escape'))closeCredits()}
 else if(sc==='title'){if(k==='r')openRank();else if(k==='i')openIntro();else if(k==='c')openCredits();else if(!e.repeat&&(k==='enter'||k===' '))adv()}
 else if(sc!=='play'&&!e.repeat&&(k==='enter'||k===' '))adv()});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
addEventListener('blur',()=>{for(const k in K)K[k]=0;dr=null;if(sc==='play')pz=1});
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const k in K)K[k]=0;dr=null;if(sc==='play')pz=1}});
</script></body></html>
